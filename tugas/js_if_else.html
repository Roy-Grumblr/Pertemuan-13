<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = 10;
        let b = 20;
        //contoh if tanpa else 

        if (a > b) {
            console.log("a lebih besar dari b");
        }

        //contoh if else
        if (a > b) {
            console.log("a lebih besar dari b");
        } else {
            console.log("a lebih kecil dari b");
        }

        //contoh nested if (menentukan nilai a,b,c,d,e)
        let c = 80;
        if(c>=90){
            console.log("nilai a");
        } else if (c>=80){
            console.log("nilai b");
        } else if (c>=70){
            console.log("nilai c");
        } else if (c>=60){
            console.log("nilai d");
        } else {
            console.log("nilai e");
        }
    </script>
</body>
</html>
